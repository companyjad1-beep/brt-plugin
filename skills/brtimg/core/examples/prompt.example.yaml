schemaKind: "prompt"
schemaVersion: 1
id: "prompt-2026-07-07-wellness-launch-001"
title: "아로마 웰니스 신제품 런칭 키비주얼"
targetGenerator: "gpt-image-2"
modes:
  - "oneshot"
  - "multimodal"
finalText: "GPT Image 2.0용 4:5 프리미엄 웰니스 브랜드 런칭 키비주얼. 참조 이미지 역할: workspace/references/characters/han-minseo-front.png는 Identity만 제어하며 포즈, 스타일, 조명, 환경은 제어하지 않는다; workspace/references/products/aroma-calm-bottle.png는 제품 형태, 앰버 유리병 비율, 매트 크림 라벨 위치만 제어하며 인물 identity, 포즈, 배경, 조명은 제어하지 않는다. 주 피사체는 workspace/characters/han-minseo.yaml의 한민서로, 30대 초반 한국인 여성, 부드러운 타원형 얼굴, 자연스러운 밝은 피부 톤, 다크 브라운 중간 길이 웨이브 헤어와 정돈된 헤어라인, 차분한 눈매, 작은 코, 자연스러운 입술, 갸름한 턱선, 왼쪽 볼 아래 작은 점, 얇은 골드 원형 귀걸이를 동일 인물로 유지한다. 한민서는 아이보리 니트 카디건을 입고 미니멀 욕실 선반 앞에 서서 오른손으로 아로마 오일 병을 가슴 높이 전경에 들고, 왼손은 병 하단을 가볍게 받치며, 시선은 카메라를 향하고 입꼬리만 살짝 올린 신뢰감 있는 미소를 짓는다. 장면은 따뜻한 아침 시간의 세라믹 화이트 욕실과 연한 세이지 그린 수건, 정돈된 나무 선반으로 제한하며 사용 목적은 신제품 런칭 광고이다. 구도는 허리 위 인물과 제품이 함께 보이는 세로 4:5 프레임, 카메라 눈높이, 85mm 광고 사진 렌즈감, f/2.8 얕은 심도, 제품 라벨은 프레임 중앙 오른쪽 3분할 교차점에 선명하게 배치하고, 왼쪽 상단과 왼쪽 중앙에는 향후 마케팅 헤드라인과 로고를 넣을 수 있도록 깨끗한 네거티브 스페이스를 전체 폭의 약 35% 남긴다. 조명은 왼쪽 전방 창문에서 들어오는 부드러운 5200K 자연광, 오른쪽 약한 크림색 반사광, 낮은 대비, 피부와 앰버 유리병에 부드러운 하이라이트가 생기고 라벨에는 눈부심이 생기지 않게 한다. 스타일과 매체는 실제 촬영한 고급 라이프스타일 광고 사진, 자연스러운 피부 질감, 과도한 보정 없는 섬세한 제품 리터칭, 세라믹과 유리의 재질감이 보이는 깨끗한 상업 사진 마감이다. 이미지 안 텍스트는 제품 라벨 중앙의 정확한 문구 \"AROMA CALM\"만 사용하고, 얇은 모던 산세리프 대문자, 가운데 정렬, 작은 라벨 안에서 선명하고 오탈자 없이 렌더링하며 다른 문구, 임의 로고, 워터마크, 서명, 가격표, 배지 텍스트는 추가하지 않는다. 제약: 한민서의 얼굴과 고유 마커를 바꾸지 말 것, 제품 병 형태와 라벨 위치를 재디자인하지 말 것, 추가 인물, 추가 제품, 꽃다발, 촛불, 과도한 장식 소품, 랜덤 브랜드 로고, 임의 배경 이야기를 만들지 말 것, 프레임 밖 범위를 확장하지 말고 단일 광고 키비주얼로 완결할 것."
designMemo:
  interpretation: "신제품 런칭용 광고 이미지를 캐릭터 일관성, 제품 라벨 가독성, 마케팅 배치 여백을 함께 만족하는 단일 키비주얼로 해석했다."
  keyChoices: "GPT Image 2.0의 텍스트 렌더링 강점을 활용하기 위해 라벨 문구를 짧게 제한하고, 참조 이미지 역할을 identity와 제품 형태로 분리했으며, 인물 앵커는 얼굴형, 헤어, 왼쪽 볼 점, 귀걸이로 고정했다."
  assumptions:
    - "브랜드 톤은 프리미엄이지만 과시적이지 않은 웰니스 감성이다."
    - "참조 캐릭터 시트는 workspace/characters/han-minseo.yaml에 저장되어 있다."
    - "최종 산출물은 광고 카피를 사후 편집할 수 있는 세로형 키비주얼이다."
  changePoints:
    - "제품명을 긴 문장 대신 AROMA CALM으로 줄여 라벨 정확도를 높였다."
    - "배경 색상을 세라믹 화이트와 세이지 그린으로 제한해 제품과 피부 톤을 분리했다."
    - "참조 이미지마다 제어 대상과 비제어 대상을 분리해 identity drift와 제품 재디자인 위험을 낮췄다."
    - "마케팅 헤드라인과 로고를 위한 왼쪽 네거티브 스페이스를 구도 지시로 추가했다."
  loopTrace:
    - pass: 1
      type: "draft"
      summary: "인물과 제품이 함께 보이는 웰니스 욕실 광고 장면을 초안으로 구성했다."
      weaknesses:
        - "참조 이미지가 무엇을 제어하는지 분리되지 않아 얼굴과 제품 스타일이 섞일 수 있었다."
        - "마케팅 카피를 넣을 여백과 라벨 타이포그래피 지시가 부족했다."
      changesApplied:
        - "한민서의 identity 앵커와 제품 라벨 문구를 초안에 고정했다."
    - pass: 2
      type: "critique"
      summary: "image.checklist 기준으로 행동, 구도, 조명, 텍스트, 제약, 참조 역할을 점검했다."
      weaknesses:
        - "행동과 손 위치가 충분히 관찰 가능하지 않았다."
        - "추가 오브젝트와 랜덤 로고 금지가 명시적으로 닫혀 있지 않았다."
      changesApplied:
        - "오른손과 왼손의 제품 상호작용, 카메라 시선, 얕은 미소를 구체화했다."
        - "워터마크, 임의 로고, 추가 인물, 추가 제품, 과도한 장식을 금지했다."
    - pass: 3
      type: "improve"
      summary: "최종 문안에 참조 역할, 렌즈감, 조명 방향, 마케팅 여백, 정확한 따옴표 텍스트를 통합했다."
      weaknesses:
        - "실제 생성 전이므로 라벨 렌더링 결과 자체는 아직 관찰되지 않았다."
      changesApplied:
        - "왼쪽 35% 네거티브 스페이스와 중앙 오른쪽 제품 배치를 추가했다."
        - "제품 라벨의 정확한 문구 \"AROMA CALM\"과 폰트 성격, 위치, 추가 텍스트 금지를 명시했다."
variants:
  - label: "정사각형 소셜 광고"
    text: "1:1 정사각형 프레임, 한민서가 제품을 가슴 높이로 들고 카메라를 향해 부드럽게 미소 짓는 웰니스 소셜 광고. 참조 캐릭터 이미지는 identity만, 제품 이미지는 병 형태와 라벨만 제어한다. 라벨 텍스트 \"AROMA CALM\"은 선명하게 보이고 상단 25%는 짧은 소셜 카피를 위한 깨끗한 여백으로 남긴다."
  - label: "제품 중심 클로즈업"
    text: "앰버 유리병과 매트 크림 라벨을 전경 오른쪽 3분할 지점에 크게 배치하고 한민서는 배경에서 동일 인물로 부드럽게 식별되는 제품 중심 클로즈업. 85mm 얕은 심도, 왼쪽 네거티브 스페이스, 라벨 문구 \"AROMA CALM\" 외 텍스트 금지, 임의 로고와 추가 제품 금지."
characterSheetRef: "workspace/characters/han-minseo.yaml"
referenceImagePaths:
