checklistResults:
  - item: "캐릭터 일관성"
    verdict: "충족"
    evidence: "얼굴형, 피부 톤, 헤어라인과 헤어스타일, 왼쪽 볼 점, 골드 귀걸이를 최종 문안에 명시했다."
  - item: "제품 텍스트 가독성"
    verdict: "충족"
    evidence: "라벨 문구를 \"AROMA CALM\"으로 제한하고 따옴표, 위치, 폰트 성격, 추가 텍스트 금지를 명시했다."
  - item: "참고이미지 역할"
    verdict: "충족"
    evidence: "캐릭터 참조는 Identity만, 제품 참조는 병 형태와 라벨만 제어하도록 비제어 영역까지 분리했다."
  - item: "마케팅 레이아웃"
    verdict: "충족"
    evidence: "왼쪽 35% 네거티브 스페이스와 제품 라벨 배치를 지정해 광고 카피와 로고 배치 여지를 확보했다."
