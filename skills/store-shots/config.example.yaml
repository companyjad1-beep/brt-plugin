# store-shots 렌더러 설정 예시 (전체 옵션 레퍼런스)
# 사용: 복사해서 config.yaml 작성 → python generate.py [config.yaml]

# 생성할 타겟 (생략 시 내장 타겟 전부)
# 내장: appstore_iphone_6_9(1320x2868), appstore_iphone_6_5(1242x2688), appstore_ipad_13(2064x2752),
#       playstore_phone(1080x2400), playstore_tablet_7(1200x1920), playstore_tablet_10(1600x2560)
enabled_targets:
  - appstore_iphone_6_9
  - playstore_phone
# targets:                       # 커스텀 타겟 추가 가능
#   my_size: { width: 1080, height: 1920 }

locales: [ko]                    # 예: [ko, en, ja] — 문자열 필드를 로케일 dict로 주면 됨

# font:                          # 생략 시 Pretendard → 맑은고딕 → Segoe UI 순으로 자동 탐색 — 맡기지 말 것 (SKILL 4단계 폰트 소싱)
#   bold: fonts/Pretendard-ExtraBold.ttf        # store_assets/fonts/에 받은 static 웨이트 (VF 금지 — PATTERNS "폰트 소싱")
#   regular: fonts/Pretendard-Medium.ttf
#   ja:                          # 로케일별 오버라이드 (일본어는 Yu Gothic 필수)
#     bold: C:/Windows/Fonts/YuGothB.ttc
#     regular: C:/Windows/Fonts/YuGothM.ttc

defaults:                        # 모든 screen에 적용, screen에서 개별 오버라이드
  background: ["#4F46E5", "#7C3AED"]   # 위→아래 그라데이션 (단색이면 같은 값 2개)
  text_color: "#FFFFFF"
  badge_color: "#F97316"         # 뱃지 배경 (accent_color 생략 시 액센트로도 사용)
  badge_text_color: "#FFFFFF"
  accent_color: ""               # [단어] 인라인 하이라이트 색
  align: center                  # center | left
  frame: true                    # true=디바이스 베젤 / false=프레임리스 라운드 카드(토스식)
  device_width: 0.88             # 생략 시 프레임 0.88 / 프레임리스 0.80 — 폰 속 글자는 폭에만 비례, 보라고 넣는 것 (PATTERNS "디바이스는 보라고")
  shadow: true                   # 디바이스/카드 드롭 섀도우
  glow: ""                       # 라디얼 글로우 색 (예: "#46538A" — 달빛)
  decor: false                   # 장식 활성화
  decor_style: dots              # dots(색종이) | stars(밤하늘 별)
  decor_palette: ["#F97316", "#10B981", "#F59E0B"]   # stars면 첫 색만 사용
  # crop: [0, 0.0455, 1, 0.952]  # 전 캡처 공통 크롭 (상태바·시스템 네비 제거) — screen별 crop이 우선

screens:
  # 기본형
  - source: screens/home.png
    badge: "AI 감정일기"                       # 아이브로우 뱃지 (세트의 절반 이하만 — QA 규칙)
    title: "[답장]이 오는 일기장"                # [단어] = accent_color 하이라이트
    subtitle: "쓰면, 도란이가 읽고 답해줘"
    cutouts:                                    # 플로팅 컷아웃(증거 칩) — 카피의 증거 UI 조각을 디바이스 위에 띄움 (PATTERNS "플로팅 컷아웃")
      - crop: [0.08, 0.18, 0.92, 0.38]          # 캡처 기준 [x0,y0,x1,y1] 비율 — 컴포넌트 경계대로
        width: 0.62                             # 캔버스 폭 대비 칩 폭
        x: 0.68                                 # 칩 중심 x (0~1)
        y: 0.58                                 # 칩 중심 y (0~1)
        rotate: -3
      # - source: screens/other.png             # 다른 캡처에서 잘라올 때

  # 로케일별 텍스트/캡처 + 투톤 헤드라인 + 회전
  - source: { ko: screens/detail.png, en: screens/en/detail.png }
    title:                                     # 줄 단위 색 지정 (playful-badge 티어)
      - { text: "현지인 별점만" }
      - { text: "따로 볼 수 있어요", color: "#0D9488" }
    rotate: -4                                 # 살짝 회전 (대기업/리듬 시그널)
    background: ["#0EA5E9", "#2563EB"]         # 화면별 배경 오버라이드

  # 위젯형 화면(캘린더·통계) 카드 크롭 확대 — QA 규칙
  - source: screens/stats.png
    title: "마음의 흐름이\n색으로 남아"
    frame: false
    crop: [0.04, 0.10, 0.96, 0.66]             # 캡처의 [x0,y0,x1,y1] 비율 크롭
    device_position: top                       # top=헤드라인에 붙임 | center=남은 공간 중앙
    device_width: 0.88

  # 편지/인용 카드: 캡처 없이 렌더러가 텍스트를 카드로 조판 (제품 인용 — 제타식 증거)
  - badge: "도란의 답장"
    title: "일기를 읽고,\n이렇게 답해줘"
    quote:
      text: "실제 답장 원문…"
      signature: "— 도란"
    device_position: top

  # codex 생성 배경 합성 (소품·사진급 연출일 때만 — SKILL 5단계 결정 규칙)
  - source: screens/map.png
    title: "오늘 갈 곳이 생겼다"                 # 기능 라벨("내 주변을 한눈에") 대신 사다리 꼭대기(결과 훅) — PATTERNS 카피 원칙 5
    background_image: marketing/backgrounds/map-hero.png
    overlay: 0.35                              # 텍스트 대비용 어둡기 0~1

# Play Store 피처 그래픽 (1024x500) — 생략 시 미생성
feature_graphic:
  title:                         # 문자열 또는 줄 단위 색 리스트 (screens와 동일)
    - { text: "가계부가" }
    - { text: "날 놀린다", color: "#C4B5FD" }
  subtitle: "쓰면 혼나는 커플 가계부"
  background: ["#232B47", "#12141F"]
  text_color: "#F2E6C9"
  source: screens/home.png       # 지정 시 우측에 디바이스, 텍스트 좌측 정렬 (생략 시 중앙 텍스트)
  # crop: [0, 0.0455, 1, 0.952]  # 디바이스 캡처 크롭 (상태바·네비 제거)
  # device: false                # 디바이스 생략하고 cutouts 칩만 쓸 때 (채팅 클로즈업형 — 가계쀼 실측)
  # cutouts:                     # screens와 동일 스키마 — source 생략 시 위 source에서 자름
  #   - crop: [0.60, 0.198, 0.985, 0.252]
  #     width: 0.28
  #     x: 0.71
  #     y: 0.20
  #     rotate: 2

# 임의 사이즈 배너 (OG·소셜·PH 갤러리·스토리) — 생략 시 미생성. output/banners/<locale>/ 에 저장
# 가로·정사각(h<=w)은 피처그래픽 레이아웃(텍스트 좌 + 디바이스 우), 세로(h>w)는 스크린샷 레이아웃으로 자동 라우팅
banners:
- name: og                       # 파일명 (생략 시 "1200x630")
  width: 1200                    # 웹 OG / 트위터 카드
  height: 630
  title: "[답장]이 오는 일기장"
  subtitle: "밤마다, 아무 말이나 괜찮아"
  source: screens/home.png       # 생략 시 텍스트 전용
  # device_width: 0.24           # 캔버스 폭 대비 디바이스 폭 (가로형 기본 0.24)
  # device_top: 0.10             # 디바이스 상단 y 비율 (가로형)
- name: story                    # 세로형 예 — 인스타 스토리/릴스 커버
  width: 1080
  height: 1920
  title: "답장이 오는 일기장"
  subtitle: "쓰면, 도란이가 읽고 답해줘"
  source: screens/home.png
  frame: false                   # 세로형은 screens와 같은 옵션(frame/crop/badge/rotate 등) 사용
